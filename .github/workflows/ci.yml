name: ci

on:
  push:
  pull_request:

# The contour neither pushes nor publishes: the token it is handed should not be able to.
permissions:
  contents: read

jobs:
  contour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Sandbox tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
          sysctl kernel.unprivileged_userns_clone || true
          # Ubuntu 24.04 keeps unprivileged user namespaces behind AppArmor. Without one
          # bwrap cannot make the mounts the contour asserts, the provider falls back to
          # landlock, and the read masks and protected names cannot apply at all.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / true

      # The contour runs the harness CLI this workspace pins as a devDependency, from
      # node_modules/.bin: the lockfile fixes every transitive package and its integrity
      # hash, so a green run describes the same tree a release run will see.
      - name: Install the pinned dependency tree
        run: npm ci

      - name: Syntax and manifest checks
        run: bash scripts/lint.sh

      - name: Headless contour (base providers vs plugin)
        run: bash scripts/check.sh

      - name: Web contour (bundle plus Settings page)
        run: DSH_BUNDLE=1 DSH_UI=1 DSH_PROBE=driver DSH_TEST_TIMEOUT=90 bash scripts/webfull.sh

      # Live rule editing in the form the packages are really installed in: the settings layer
      # must write the profile patch and the rules must apply without a restart.
      - name: Settings page writes apply to a bundle-installed profile
        run: DSH_BUNDLE=1 DSH_UI=1 DSH_PROBE=settings-write DSH_TEST_TIMEOUT=90 bash scripts/webfull.sh

      # The step above only means something if it can fail: this one injects an entry that
      # cannot resolve and requires the contour to notice.
      - name: The web contour gate can fail
        run: DSH_EXPECT_BOOT_FAILURE=1 DSH_TEST_TIMEOUT=90 bash scripts/webfull.sh

      - name: Page boot and settings section checks
        run: |
          sudo apt-get install -y chromium || true
          CHROME_BIN="$(command -v chromium || command -v google-chrome || command -v google-chrome-stable)" \
            bash scripts/page-check.sh

