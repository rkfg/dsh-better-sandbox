# @rkfg/dsh-better-sandbox: a sandbox with extra roots for writing, .git protected
# from modification, and secrets protected from reading.
#
# The list values (writableDirs, readDenyDirs, readDenyFiles) are deliberately NOT here:
# the profile (or the settings page) supplies them; the bundle layer only describes the
# set of entries and which base providers they replace.
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  disabled: true
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  disabled: true
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
  disabled: true
- insert:
    - id: better-sandbox
      name: '@rkfg/dsh-better-sandbox/rules'
    - id: better-sandbox-escalation
      name: '@rkfg/dsh-better-sandbox/escalation'
    - id: better-sandbox-fs
      name: '@rkfg/dsh-better-sandbox/fs'
    - id: better-sandbox-runner
      name: '@rkfg/dsh-better-sandbox/runner'
    - id: better-sandbox-subprocess
      name: '@rkfg/dsh-better-sandbox/subprocess'
    - id: better-sandbox-guard
      name: '@rkfg/dsh-better-sandbox/guard-api'
