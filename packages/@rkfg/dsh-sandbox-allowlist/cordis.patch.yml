# @rkfg/dsh-sandbox-allowlist: a sandbox with extra roots for writing, .git protected
# from modification, and secrets protected from reading.
#
# The list values (writableDirs, readDenyDirs, readDenyFiles) are deliberately NOT here:
# the profile (or the settings page) supplies them; the bundle layer only describes the
# set of entries and which base providers they replace.
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  disabled: true
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  disabled: true
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
  disabled: true
- insert:
    - id: sandbox-allowlist
      name: '@rkfg/dsh-sandbox-allowlist/allowlist'
    - id: fs-allowlist
      name: '@rkfg/dsh-sandbox-allowlist/fs'
    - id: sandbox-allowlist-runner
      name: '@rkfg/dsh-sandbox-allowlist/runner'
    - id: subprocess-guard
      name: '@rkfg/dsh-sandbox-allowlist/subprocess'
    - id: sandbox-guard-api
      name: '@rkfg/dsh-sandbox-allowlist/guard-api'
